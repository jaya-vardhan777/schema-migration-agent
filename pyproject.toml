[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "schema-migrator"
version = "0.1.0"
description = "Agentic cross-dialect schema transpiler (Oracle/Postgres -> BigQuery/ClickHouse/Snowflake) built on LangChain + LangGraph."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OIP AI Prototype" }]
license = { text = "Proprietary" }
keywords = ["schema", "migration", "ddl", "langgraph", "bigquery", "clickhouse", "snowflake"]

dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.40",
    "langsmith>=0.1.100",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "sqlglot>=25.0.0",
    "ruamel.yaml>=0.18.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "prometheus-client>=0.20",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
bedrock = ["langchain-aws>=0.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
schema-migrate = "schema_migrator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_migrator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
